# Winner Predict full stack (FastAPI backend + React/Vite frontend).
# The repo also contains a legacy Flask app (backend/utils.py era) and the
# aviator_enterprise sibling app; those are NOT part of this compose file.
#
# Note: `npm start` runs the legacy aviator_enterprise app on port 8002, so
# it no longer collides with this stack (8000 is owned by the backend).
services:
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)); assert d['service']=='winner-predict-backend'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
      # Keep host node_modules out of the container: the host may have built
      # them against glibc while node:20-alpine uses musl.
      - /app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    init: true
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8000
