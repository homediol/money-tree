# Winner Predict dashboard services (FastAPI backend + React/Vite frontend).
# Run the real round collector separately with `npm run collector`.
services:
  backend:
    image: python:3.11-slim
    working_dir: /app/backend
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000 --limit-concurrency ${WINNER_UVICORN_LIMIT_CONCURRENCY:-256} --timeout-keep-alive 5"
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)); assert d['status']=='ONLINE'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  frontend:
    image: node:20-alpine
    working_dir: /app/frontend
    volumes:
      - .:/app
      # Keep host node_modules out of the container: the host may have built
      # them against glibc while node:20-alpine uses musl.
      - /app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5174"
    environment:
      - BACKEND_PROXY_TARGET=http://backend:8000
      # The browser calls the independent Behaviour API directly in containerized
      # frontend runs; this exposes no credentials to client code.
      - VITE_BEHAVIOUR_API_BASE_URL=${VITE_BEHAVIOUR_API_BASE_URL:-http://localhost:8100}
